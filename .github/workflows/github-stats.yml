name: Atualizar GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar pasta dos cards
        run: mkdir -p profile

      - name: Gerar card de estatísticas
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: >-
            username=${{ github.repository_owner }}
            &show_icons=true
            &include_all_commits=true
            &locale=pt-br
            &bg_color=0f1117
            &title_color=4FC3F7
            &text_color=ffffff
            &icon_color=FF6B1A
            &border_color=4FC3F7
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar card de linguagens
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: >-
            username=${{ github.repository_owner }}
            &layout=compact
            &langs_count=10
            &locale=pt-br
            &bg_color=0f1117
            &title_color=4FC3F7
            &text_color=ffffff
            &border_color=4FC3F7
            &custom_title=Linguagens%20Mais%20Usadas
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Salvar cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git diff --cached --quiet || git commit -m "Atualiza GitHub Stats"

          git push
